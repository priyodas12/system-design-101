name: sd101-cassandra

services:
  cassandra:
    image: cassandra:5.0
    container_name: sd101-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME}
      MAX_HEAP_SIZE: ${MAX_HEAP_SIZE}
      HEAP_NEWSIZE: ${HEAP_NEWSIZE}
    ports:
      - "${CASSANDRA_PORT}:9042"
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  cassandradata:
